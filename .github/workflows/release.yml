name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Require the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing repository secret KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing repository secret KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing repository secret KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing repository secret KEY_PASSWORD"; exit 1; }

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/release.keystore

      - name: Check the tag matches versionName
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#V}"
          NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ "$TAG" != "$NAME" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${NAME}."
            echo "Bump versionName and versionCode, commit, then push a tag equal to versionName."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Write the release notes and latest.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/douyin-save.apk
        run: |
          cp app/build/outputs/apk/release/*.apk douyin-save.apk
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" || true)
          {
            if [ -n "$NOTES" ]; then
              printf '%s\n\n' "$NOTES"
            fi
            printf '版本 %s\n\nversionCode: %s\n' "$VERSION_NAME" "$VERSION_CODE"
          } > release-body.md
          python3 - << 'PY'
          import json, os
          notes = open("release-body.md", encoding="utf-8").read()
          changelog = "\n".join(
              line for line in notes.splitlines() if not line.startswith("versionCode:")
          ).strip()
          json.dump(
              {
                  "versionCode": int(os.environ["VERSION_CODE"]),
                  "versionName": os.environ["VERSION_NAME"],
                  "changelog": changelog,
                  "apkUrl": os.environ["APK_URL"],
              },
              open("latest.json", "w", encoding="utf-8"),
              ensure_ascii=False,
              indent=2,
          )
          PY

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          body_path: release-body.md
          files: |
            douyin-save.apk
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
